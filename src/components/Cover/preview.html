<style>
  html, body { margin:0; height:100%; }

  .name { margin:0; font-family:var(--font-display); font-size:120px; line-height:.92; font-weight:800; letter-spacing:-.03em; color:var(--ink); }
  .logo { display:block; width:340px; height:auto; }
  .lg-ink { fill:var(--ink); }
  .lg-rose { fill:var(--rose); }
  .lg-lagoon { fill:var(--lagoon); }
