body { margin: 0; font-family: var(--font-sans); font-size: 16px; line-height: 24px; background: var(--surface); color: var(--ink); }
.ig-row { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4); }

.ig-field { display: flex; flex-direction: column; gap: var(--space-2); max-width: 360px; }
.ig-field-label { font-size: 14px; line-height: 20px; font-weight: 600; }
.ig-field-box { display: flex; align-items: center; background: var(--surface-raised); border: 1.5px solid var(--line-strong); border-radius: var(--radius-md); padding: 0 var(--space-4); }
.ig-field-box:focus-within { border-color: var(--focus); box-shadow: 0 0 0 1.5px var(--focus); }
.ig-field-input:focus, .ig-field-input:focus-visible { outline: none; }

.ig-tag { display: inline-flex; align-items: center; height: 26px; padding: 0 var(--space-3); border-radius: var(--radius-pill); font-size: 13px; font-weight: 700; line-height: 1; white-space: nowrap; border: 1.5px solid transparent; }

.ig-cal { display: grid; grid-template-columns: 28px 1fr auto; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-4); background: var(--surface-raised); border: 1px solid var(--line); border-radius: var(--radius-md); }
.ig-cal-event { background: var(--sky-soft); border-color: transparent; }
.ig-check { appearance: none; -webkit-appearance: none; margin: 0; width: 22px; height: 22px; border: 1.5px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface-raised); cursor: pointer; display: grid; place-content: center; }
.ig-check:checked { background: var(--mint); border-color: var(--mint); }
.ig-check:checked::after { content: ''; width: 10px; height: 6px; border-left: 2.5px solid var(--on-rose); border-bottom: 2.5px solid var(--on-rose); transform: rotate(-45deg) translate(1px, -1px); }
.ig-cal-dot { width: 14px; height: 14px; margin-left: 4px; border-radius: 999px; background: var(--sky); }
.ig-cal-main { min-width: 0; }
.ig-cal-title { margin: 0; font-weight: 600; }
.ig-cal-meta { margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }

.ig-cal-event .ig-cal-kind { color: var(--sky); }
.ig-cal-date { font-family: var(--font-mono); font-size: 14px; line-height: 20px; font-variant-numeric: tabular-nums; }

.ig-slot { display: grid; grid-template-columns: 72px 1fr; gap: var(--space-4); padding: var(--space-3) 0; border-top: 1px solid var(--line); }
.ig-slot-time { display: flex; flex-direction: column; font-family: var(--font-mono); font-size: 14px; line-height: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.ig-slot-end { color: var(--ink-muted); }
.ig-slot-body { padding: var(--space-2) var(--space-4); border-radius: var(--radius-md); background: var(--surface-raised); border: 1px solid var(--line); }

.ig-slot-title { margin: 0; font-weight: 600; }
.ig-slot-meta { margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }

.ig-nav { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-5); background: var(--surface-sunk); border-radius: var(--radius-pill); flex-wrap: wrap; }

.ig-nav-list { display: flex; gap: var(--space-1); list-style: none; margin: 0; padding: 0; flex-wrap: wrap; flex: 1; }
.ig-nav-link { display: inline-flex; align-items: center; height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-pill); color: var(--ink); text-decoration: none; font-weight: 600; font-size: 15px; }
.ig-nav-link:hover { background: var(--surface-raised); }
.ig-nav-link.is-active { background: var(--ink); color: var(--surface); }
.ig-nav-count { display: inline-flex; align-items: baseline; gap: var(--space-1); height: 36px; padding: 0 var(--space-4); border-radius: var(--radius-pill); background: var(--lagoon); color: var(--on-lagoon); font-size: 14px; line-height: 36px; }
.ig-nav-count strong { font-family: var(--font-display); font-size: 18px; }

/* Liquid glass — csak lebegő rétegek */
.ig-glass { background: var(--glass-fill); border: 1px solid var(--glass-edge); box-shadow: var(--shadow-glass); -webkit-backdrop-filter: var(--blur-glass); backdrop-filter: var(--blur-glass); }
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .ig-glass { background: var(--surface-raised); } }

.ig-nav.ig-glass { background: var(--glass-fill); }
.ig-nav.ig-glass .ig-nav-link:hover { background: var(--glass-edge); }
.ig-backdrop { position: relative; padding: var(--space-5) var(--space-4); overflow: hidden; background: var(--surface); }
.ig-backdrop::before, .ig-backdrop::after { content: ''; position: absolute; border-radius: 999px; }
.ig-backdrop::before { width: 220px; height: 220px; left: 8%; top: -60px; background: var(--rose); }
.ig-backdrop::after { width: 180px; height: 180px; right: 12%; bottom: -70px; background: var(--lagoon); }
.ig-backdrop > * { position: relative; }
.ig-menu { display: inline-flex; flex-direction: column; min-width: 220px; padding: var(--space-2); border-radius: var(--radius-lg); }
.ig-menu-item { font: inherit; text-align: left; display: flex; justify-content: space-between; gap: var(--space-4); padding: var(--space-2) var(--space-3); border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); cursor: pointer; font-weight: 600; }
.ig-menu-item:hover { background: var(--glass-edge); }
.ig-menu-item:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.ig-menu-hint { font-weight: 400; color: var(--ink-muted); font-size: 14px; }

.ig-card.ig-card-glass { background: var(--glass-fill); border-color: var(--glass-edge); }
.ig-card-glass .ig-card-eyebrow, .ig-card-glass .ig-muted { color: var(--ink); opacity: .78; }

.ig-cal.ig-cal-glass.ig-cal-event { background: var(--glass-sky); }
.ig-cal-glass .ig-cal-meta, .ig-cal-glass.ig-cal-task .ig-cal-kind { color: var(--ink); opacity: .78; }
@media (prefers-reduced-transparency: reduce) { .ig-cal.ig-cal-glass.ig-cal-event { background: var(--sky-soft); } }

.ig-logo { display: block; width: auto; }

/* ================= Webhely és app ================= */
.ig-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ig-icon { display: inline-block; flex: none; vertical-align: middle; }
.ig-badge { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-pill); background: var(--rose); color: var(--on-rose); font-size: 11px; line-height: 18px; font-weight: 700; text-align: center; box-sizing: border-box; }

/* Ikon-gomb: 44px érintési cél, 24px ikon */
.ig-iconbtn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: var(--tap-min); height: var(--tap-min); border-radius: var(--radius-pill); border: 0; background: transparent; color: var(--ink); cursor: pointer; text-decoration: none; }
.ig-iconbtn:hover { background: var(--surface-sunk); }
.ig-iconbtn-outline { border: 1.5px solid var(--line-strong); background: var(--surface-raised); }
.ig-iconbtn-primary { background: var(--rose); color: var(--on-rose); }

.ig-iconbtn:focus-visible, .ig-tab:focus-visible, .ig-li-action:focus-visible, .ig-seg-btn:focus-visible, .ig-switch:focus-visible, .ig-chip:focus-visible, .ig-select:focus-visible, .ig-toast-action:focus-visible, .ig-acc-q:focus-visible, .ig-footer a:focus-visible, .ig-vendor:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* TabBar: lebegő pirula, 5 fül, alul safe area */
.ig-tabbar { display: flex; align-items: stretch; height: var(--tabbar); padding: var(--space-1); padding-bottom: calc(var(--space-1) + env(safe-area-inset-bottom, 0px)); box-sizing: content-box; border-radius: var(--radius-pill); z-index: var(--z-nav); }
.ig-tab { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--radius-pill); color: var(--ink-muted); text-decoration: none; }
.ig-tab-icon { position: relative; display: inline-flex; }
.ig-tab-label { font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ig-tab:hover { color: var(--ink); }
.ig-tab.is-active { background: var(--rose-soft); color: var(--rose); }
.ig-tabbar:not(.ig-glass) { background: var(--surface-sunk); }

/* AppBar */
.ig-appbar { display: flex; flex-direction: column; padding: 0 var(--space-2); border-radius: var(--radius-lg); z-index: var(--z-nav); }

.ig-appbar-large-block { padding: 0 var(--space-2) var(--space-4); }

.ig-appbar-sub { margin: var(--space-1) 0 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }

/* Lista és sor */

.ig-li { display: flex; align-items: center; gap: var(--space-3); min-height: 56px; padding: var(--space-2) var(--space-4); box-sizing: border-box; width: 100%; text-align: left; font: inherit; color: var(--ink); background: transparent; border: 0; text-decoration: none; }

.ig-li-action:hover { background: var(--surface-sunk); }

.ig-li-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ig-li-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ig-li-meta { font-size: 14px; line-height: 20px; color: var(--ink-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.ig-scrim-center { align-items: center; padding: var(--space-4); }

.ig-sheet-dialog { max-width: 480px; border-radius: var(--radius-lg); }
